name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-train-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Retrain model (reproducibility check)
        run: python train.py

      - name: Run tests with coverage
        run: pytest --cov=main --cov-report=term-missing --cov-fail-under=85

  docker-build:
    needs: lint-train-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ml-inference-api:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 ml-inference-api:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health | grep '"model_loaded":true'
          docker rm -f api
